[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-scikit-image"
version = "0.1.0"
description = "Mojo kernels with a scikit-image-compatible Python API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
